name: Validate website and publication
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run content:validate
      - run: npm test -- --run
      - run: npm run test:rules
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: review-build
          path: dist/
          include-hidden-files: true
          retention-days: 14
