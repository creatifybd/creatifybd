name: Deploy approved Bengali release to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: creatifybd-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # A missing Firebase credential must not leave legacy public lead files
      # exposed. This limited action writes only a deny rule, never datasets.
      - name: Contain legacy public lead data
        run: node scripts/hostinger-ops.mjs contain
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      - name: Preserve original data-directory access rule
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-backup-${{ github.sha }}-${{ github.run_attempt }}
          path: .production-backup/contain/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify private datasets are no longer publicly accessible
        run: node scripts/verify-live.mjs --containment-only
      - run: npm run content:validate
      - run: npm test -- --run
      - run: npm run test:rules
      - name: Build the same approved content into every public route
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      - name: Keep a recoverable build before upload
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 30
      - name: Require protected Firebase access before changing production
        run: node scripts/configure-firebase-ci.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Back up current public pages before full publication
        run: node scripts/hostinger-ops.mjs backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      - name: Preserve rollback pages and checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-pages-before-${{ github.sha }}-${{ github.run_attempt }}
          path: .production-backup/backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - run: npm run content:prepare
      - name: Check the database plan before upload
        run: npm run content:plan
      - name: Deploy validated form and role rules
        run: npx firebase deploy --only firestore:rules,storage --project creatify-bd --non-interactive
      - run: node scripts/stage-deploy.mjs
      - name: Upload assets while retaining earlier hashed bundles
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./deploy-assets/
          server-dir: /public_html/
          state-name: .creatifybd-assets-${{ github.sha }}.json
          dangerous-clean-slate: false
          timeout: 180000
      - name: Publish pre-rendered pages after all assets exist
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./deploy-pages/
          server-dir: /public_html/
          state-name: .creatifybd-pages.json
          dangerous-clean-slate: false
          timeout: 180000
      - name: Verify deployed release, metadata, routes and data containment
        run: node scripts/verify-live.mjs
      - name: Verify every live route, back up records and synchronize Firestore
        run: npm run sync:firebase -- --apply
      - name: Keep public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: .production-verification/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary deployment credential
        if: always()
        run: node -e "const fs=require('fs'); const p=process.env.GOOGLE_APPLICATION_CREDENTIALS; if(p)fs.rmSync(p,{force:true});"
